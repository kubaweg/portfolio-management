<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mój Portfel Inwestycyjny{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard.dashboard') }}">📈 InvestTracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('analysis.analysis') }}">Analizy</a>
                <a class="nav-link" href="{{ url_for('add_asset.add_asset') }}">Dodaj aktywo</a>
                <a class="nav-link" href="{{ url_for('add_transaction.add_transaction') }}">Dodaj transakcję</a>
                <a class="nav-link" href="{{ url_for('list_transactions.list_transactions') }}">Historia/Usuń</a>
            </div>
        </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 text-muted">
        <small>&copy; Portfel Inwestycyjny - Zbudowano we Flasku</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
