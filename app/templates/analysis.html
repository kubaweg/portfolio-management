{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2><i class="fas fa-chart-line me-2"></i>Analiza Instrumentu</h2>
    <hr>

    <div class="row mb-4">
        <div class="col-md-4">
            <label for="tickerSelect" class="form-label">Wybierz instrument:</label>
            <select id="tickerSelect" class="form-select border-primary">
                <option value="" selected disabled>-- Wybierz ticker --</option>
                {% for ticker in tickers %}
                <option value="{{ ticker }}">{{ ticker }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-8 d-flex align-items-end">
            <div class="btn-group" role="group" id="periodButtons">
                <button type="button" class="btn btn-outline-secondary" data-period="1mo">1M</button>
                <button type="button" class="btn btn-outline-primary active" data-period="3mo">3M</button>
                <button type="button" class="btn btn-outline-secondary" data-period="6mo">6M</button>
                <button type="button" class="btn btn-outline-secondary" data-period="1y">1Y</button>
                <button type="button" class="btn btn-outline-secondary" data-period="5y">5Y</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div id="chart-loader" class="text-center d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Pobieranie danych...</p>
            </div>
            <div id="main-chart"></div>
            <div id="chart-error" class="alert alert-warning d-none">
                Nie udało się pobrać danych dla tego instrumentu.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script>
    let chart = null;

    function initChart() {
        const options = {
            chart: {
                type: 'candlestick',
                height: 450,
                id: 'analysisChart',
                zoom: { enabled: true },
                toolbar: { show: true }
            },
            series: [],
            xaxis: {
                type: 'datetime',
                labels: { format: 'yyyy-MM-dd' },
                // --- TWOJA WIZJA (Format daty w dymku na dole) ---
                tooltip: {
                    enabled: true,
                    formatter: function (val) {
                        // Wymuszamy format ISO YYYY-MM-DD
                        const d = new Date(val);
                        return d.getFullYear() + '-' +
                            String(d.getMonth() + 1).padStart(2, '0') + '-' +
                            String(d.getDate()).padStart(2, '0');
                    }
                }
            },
            yaxis: { labels: { formatter: (val) => val.toFixed(2) } },
            dataLabels: { enabled: false },
            stroke: { width: 1 },
            annotations: {
                yaxis: [],
                xaxis: [] // Miejsce na pionowe linie transakcji
            },
            markers: {
                size: 0,
                hover: { size: 10 }
            },
            tooltip: {
                custom: function ({ series, seriesIndex, dataPointIndex, w }) {
                    const data = w.globals.initialSeries[seriesIndex].data[dataPointIndex];

                    if (data.transaction) {
                        const t = data.transaction;
                        const typeColor = (t.type === 'KUPNO') ? 'text-success' : 'text-danger';

                        // Logika zwrotu (ROI)
                        let returnHtml = '';
                        if (t.return_total !== undefined && t.return_total !== null) {
                            const perc = (t.return_total * 100).toFixed(2);
                            const badgeColor = perc >= 0 ? 'bg-success' : 'bg-danger';
                            returnHtml = `<p class="mb-0 mt-2 text-center">
                                            <span class="badge ${badgeColor}">Zwrot: ${perc}%</span>
                                          </p>`;
                        }

                        return `<div class="card p-3 shadow border-0">
                            <div class="card-header bg-white border-0 p-0 text-center ${typeColor} fw-bold">${t.type}</div>
                            <div class="card-body p-0 pt-2">
                                <p class="mb-1">Data: <b>${t.date}</b></p>
                                <p class="mb-1">Cena transakcji: <b>${t.price.toFixed(2)}</b></p>
                                <p class="mb-1">Wolumen: <b>${t.quantity}</b></p>
                                ${returnHtml}
                            </div></div>`;
                    }

                    const o = data.y[0].toFixed(2);
                    const h = data.y[1].toFixed(2);
                    const l = data.y[2].toFixed(2);
                    const c = data.y[3].toFixed(2);

                    return `<div class="p-2" style="font-family: sans-serif; font-size: 13px;">
                        <div><b>Open:</b> ${o}</div>
                        <div><b>High:</b> ${h}</div>
                        <div><b>Low:</b> ${l}</div>
                        <div><b>Close:</b> ${c}</div>
                    </div>`;
                }
            },
            noData: { text: 'Wybierz instrument...' }
        };
        chart = new ApexCharts(document.querySelector("#main-chart"), options);
        chart.render();
    }

    async function updateChart() {
        const ticker = document.getElementById('tickerSelect').value;
        const periodBtn = document.querySelector('#periodButtons .active');
        const period = periodBtn ? periodBtn.dataset.period : '3mo';

        if (!ticker) return;

        // UI State - sygnalizacja ładowania
        document.getElementById('chart-loader').classList.remove('d-none');
        document.getElementById('main-chart').style.opacity = "0.3";

        try {
            const response = await fetch(`/api/history/${ticker}?period=${period}`);
            if (!response.ok) throw new Error("Błąd pobierania danych");
            const result = await response.json();

            // 1. Przygotowanie serii danych (Świece)
            const transMap = new Map();
            result.transactions.forEach(t => transMap.set(t.date, t));

            let markerIndices = [];
            let markerColors = [];

            const seriesData = result.historical_data.map((item, index) => {
                const time = new Date(item.date).getTime();
                const transaction = transMap.get(item.date);

                if (transaction) {
                    markerIndices.push(index);
                    markerColors.push((transaction.type === 'KUPNO') ? '#198754' : '#dc3545');
                }

                return {
                    x: time,
                    y: [item.open, item.high, item.low, item.close],
                    transaction: transaction
                };
            });

            // 2. Przygotowanie adnotacji (Y - średnia, X - transakcje)
            let yAnnotations = [];
            if (result.avg_price) {
                yAnnotations.push({
                    y: result.avg_price,
                    borderColor: '#444444',
                    borderWidth: 2,
                    opacity: 0.6,
                    position: 'back',
                    label: {
                        text: 'Średnia Cena: ' + result.avg_price.toFixed(2),
                        textAnchor: 'start',
                        position: 'left',
                        offsetX: 10,
                        offsetY: -10,
                        style: { color: '#fff', background: '#888888' }
                    }
                });
            }

            let xAnnotations = result.transactions.map(t => ({
                x: new Date(t.date).getTime(),
                strokeDashArray: 4,
                borderColor: '#888888',
                borderWidth: 1,
                label: { show: false }
            }));

            // 3. ATOMIC UPDATE - Jedna aktualizacja dla wszystkich parametrów
            // To eliminuje "wyścig" i konieczność podwójnego klikania.
            chart.updateOptions({
                series: [{ name: ticker, data: seriesData }],
                annotations: {
                    yaxis: yAnnotations,
                    xaxis: xAnnotations
                },
                markers: {
                    size: 0,
                    discrete: markerIndices.map((idx, i) => ({
                        seriesIndex: 0,
                        dataPointIndex: idx,
                        fillColor: markerColors[i],
                        strokeColor: '#fff',
                        size: 8,
                        shape: "circle"
                    }))
                },
                xaxis: {
                    // Wymuszamy autoscale przy każdej zmianie, by osie nie "zamarzły"
                    min: undefined,
                    max: undefined
                }
            }, false, true); // (redraw=false, animate=true)

        } catch (err) {
            console.error("Chart Update Error:", err);
            document.getElementById('chart-error').classList.remove('d-none');
        } finally {
            document.getElementById('chart-loader').classList.add('d-none');
            document.getElementById('main-chart').style.opacity = "1";
        }
    }

    document.getElementById('tickerSelect').addEventListener('change', updateChart);
    document.querySelectorAll('#periodButtons button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#periodButtons button').forEach(b => b.classList.remove('active', 'btn-outline-primary'));
            document.querySelectorAll('#periodButtons button').forEach(b => b.classList.add('btn-outline-secondary'));
            btn.classList.add('active', 'btn-outline-primary');
            btn.classList.remove('btn-outline-secondary');
            updateChart();
        });
    });
    document.addEventListener('DOMContentLoaded', initChart);
</script>
{% endblock %}
